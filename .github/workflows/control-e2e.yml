name: control-e2e

# Proposal (rc5): the Clearline Control browser suite against a real PostgreSQL 16, the same pattern as the
# control-db job in ci.yml. Not a required check yet. Every credential below is a CI-only, test-only string for a
# throwaway service container; none is a deployment secret.

on:
  pull_request:
  push:
    branches: [main]
  # v1 phase 6: also a gate of deploy-staging.yml
  workflow_call:

permissions:
  contents: read

concurrency:
  group: control-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  control-e2e:
    name: control-e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-superuser-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # v1 #165: every server this job starts says where it runs (a production server refuses without it)
      CLEARLINE_DEPLOY_ENV: ci
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ci-only-superuser-password
      CLEARLINE_E2E_OWNER_URL: postgres://clearline_owner:ci-owner-pw@127.0.0.1:5432/clearline_e2e
      CLEARLINE_E2E_RUNTIME_URL: postgres://clearline_runtime:ci-runtime-pw@127.0.0.1:5432/clearline_e2e
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.22.0"
          cache: npm
      - run: npm ci
      - run: scripts/db/setup-local.sh clearline_e2e ci-owner-pw ci-runtime-pw ci-jobs-pw ci-provisioning-pw
      - run: npx playwright install --with-deps chromium
      # The build must use the same pilot environment as `next start` (the deployment gate reads it).
      - name: Build the pilot
        run: npx next build
        env:
          CLEARLINE_CONTROL_PILOT: "1"
          DATABASE_URL: postgres://clearline_runtime:ci-runtime-pw@127.0.0.1:5432/clearline_e2e
          BETTER_AUTH_SECRET: test-only-e2e-secret-not-for-deploy-0001
          CLEARLINE_ORIGIN: http://127.0.0.1:3197
      - run: npm run e2e:control -- --retries=0 --trace off
