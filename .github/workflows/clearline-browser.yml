name: Clearline customer-preview browser acceptance
on:
  pull_request:
    paths:
      - 'src/app/clearline/**'
      - 'src/app/api/clearline/**'
      - 'src/components/clearline/**'
      - 'src/lib/clearline/**'
      - 'src/middleware.ts'
      - 'playwright.clearline.config.ts'
      - 'tests/browser/clearline-console.spec.ts'
      - '.github/workflows/clearline-browser.yml'
permissions:
  contents: read
concurrency:
  group: clearline-browser-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  clearline-browser:
    name: clearline-browser
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.0'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx next build
      - name: Test customer journeys on desktop and mobile
        run: npx playwright test --config=playwright.clearline.config.ts
      - name: Upload actual preview screenshots and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: clearline-preview-${{ github.event.pull_request.head.sha }}
          path: |
            clearline-browser-artifacts/
            test-results/
          retention-days: 14
          if-no-files-found: warn
