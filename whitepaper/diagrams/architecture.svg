<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" font-family="Inter, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6272"/></marker>
  </defs>
  <rect width="800" height="400" fill="#ffffff"/>
  <text x="20" y="22" font-size="12" font-weight="600" fill="#8a93a3" letter-spacing="1">PEOPLE</text>
  <rect x="20" y="40" width="130" height="56" rx="8" fill="#f4f5f8" stroke="#a3abba"/>
  <text x="85" y="64" font-size="13.5" font-weight="600" text-anchor="middle">Payer</text>
  <text x="85" y="82" font-size="11" text-anchor="middle" fill="#5b6272">payment page</text>
  <rect x="20" y="250" width="130" height="56" rx="8" fill="#f4f5f8" stroke="#a3abba"/>
  <text x="85" y="274" font-size="13.5" font-weight="600" text-anchor="middle">Finance user</text>
  <text x="85" y="292" font-size="11" text-anchor="middle" fill="#5b6272">browser</text>

  <rect x="180" y="30" width="430" height="350" rx="12" fill="#f7f8ff" stroke="#6e7df0" stroke-width="1.4"/>
  <text x="196" y="52" font-size="12" font-weight="600" fill="#6e7df0" letter-spacing="1">CLEARLINE · ONE COMPANY PER DEPLOYMENT</text>
  <g font-size="11" fill="#5b6272">
    <rect x="200" y="66" width="180" height="50" rx="7" fill="#fff" stroke="#6e7df0"/>
    <text x="212" y="86" font-size="13" font-weight="600" fill="#0a0c11">Payment requests</text><text x="212" y="104">instruction · address checker</text>
    <rect x="410" y="66" width="180" height="50" rx="7" fill="#fff" stroke="#6e7df0"/>
    <text x="422" y="86" font-size="13" font-weight="600" fill="#0a0c11">Ingestion</text><text x="422" y="104">one record per chain:hash:log</text>
    <rect x="410" y="136" width="180" height="50" rx="7" fill="#fff" stroke="#6e7df0"/>
    <text x="422" y="156" font-size="13" font-weight="600" fill="#0a0c11">Rules engine</text><text x="422" y="174">deterministic checks, evidence</text>
    <rect x="200" y="136" width="180" height="50" rx="7" fill="#fff" stroke="#6e7df0"/>
    <text x="212" y="156" font-size="13" font-weight="600" fill="#0a0c11">Matching and state</text><text x="212" y="174">attribution · derived state</text>
    <rect x="200" y="206" width="180" height="50" rx="7" fill="#fff" stroke="#6e7df0"/>
    <text x="212" y="226" font-size="13" font-weight="600" fill="#0a0c11">Explanation</text><text x="212" y="244">templates; optional AI, validated</text>
    <rect x="410" y="206" width="180" height="50" rx="7" fill="#fff" stroke="#6e7df0"/>
    <text x="422" y="226" font-size="13" font-weight="600" fill="#0a0c11">Accounting</text><text x="422" y="244">plan → approve → post</text>
    <rect x="200" y="296" width="390" height="66" rx="7" fill="#ffffff" stroke="#a3abba" stroke-dasharray="4 3"/>
    <text x="212" y="318" font-size="13" font-weight="600" fill="#0a0c11">Records (append-only in the application)</text>
    <text x="212" y="336">requests · transfers · check snapshots · decisions with notes · posting audit</text>
    <text x="212" y="352">JSON files today; database, sign-in and tamper-evidence are planned</text>
  </g>
  <g stroke="#5b6272" stroke-width="1.4" fill="none" marker-end="url(#a)">
    <line x1="150" y1="68" x2="198" y2="88"/>
    <line x1="500" y1="116" x2="500" y2="134"/>
    <line x1="408" y1="161" x2="382" y2="161"/>
    <line x1="290" y1="186" x2="290" y2="204"/>
    <line x1="382" y1="176" x2="430" y2="204"/>
    <line x1="150" y1="270" x2="198" y2="240"/>
    <line x1="150" y1="290" x2="408" y2="250"/>
    <line x1="290" y1="256" x2="290" y2="294"/>
    <line x1="500" y1="256" x2="500" y2="294"/>
  </g>
    <text x="640" y="22" font-size="12" font-weight="600" fill="#8a93a3" letter-spacing="1">OUTSIDE SYSTEMS</text>
  <rect x="640" y="56" width="145" height="70" rx="8" fill="#f4f5f8" stroke="#a3abba"/>
  <text x="712" y="80" font-size="13" font-weight="600" text-anchor="middle">Blockchain</text>
  <text x="712" y="97" font-size="11" text-anchor="middle" fill="#5b6272">public read APIs</text>
  <text x="712" y="113" font-size="11" text-anchor="middle" fill="#5b6272">(Ethereum for requests)</text>
  <rect x="640" y="196" width="145" height="70" rx="8" fill="#f4f5f8" stroke="#a3abba"/>
  <text x="712" y="220" font-size="13" font-weight="600" text-anchor="middle">Accounting system</text>
  <text x="712" y="237" font-size="11" text-anchor="middle" fill="#5b6272">Xero (in testing)</text>
  <text x="712" y="253" font-size="11" text-anchor="middle" fill="#5b6272">QuickBooks (built)</text>
  <g stroke="#5b6272" stroke-width="1.4" fill="none" marker-end="url(#a)">
    <line x1="638" y1="91" x2="592" y2="91"/>
    <line x1="592" y1="222" x2="638" y2="222"/>
    <line x1="638" y1="240" x2="592" y2="240"/>
  </g>
  <text x="712" y="146" font-size="10.5" text-anchor="middle" fill="#2f7d5b" font-weight="600">read-only: looks up</text>
  <text x="712" y="160" font-size="10.5" text-anchor="middle" fill="#2f7d5b">a transfer by its tx hash</text>
  <text x="712" y="290" font-size="10.5" text-anchor="middle" fill="#0a0c11">reads invoices; writes only</text>
  <text x="712" y="304" font-size="10.5" text-anchor="middle" fill="#0a0c11">after a person approves</text>
  <rect x="640" y="326" width="145" height="40" rx="8" fill="#eaf7f0" stroke="#2f7d5b"/>
  <text x="712" y="344" font-size="11.5" font-weight="700" text-anchor="middle" fill="#2f7d5b">No wallet keys.</text>
  <text x="712" y="359" font-size="11.5" font-weight="700" text-anchor="middle" fill="#2f7d5b">Never holds funds.</text>
</svg>
