name: Mentor demo browser acceptance
on:
  pull_request:
    paths:
      - 'src/components/mentor-demo/**'
      - 'src/lib/mentor-demo/**'
      - 'src/app/mentor-demo/**'
      - 'src/app/layout.tsx'
      - 'src/middleware.ts'
      - 'tests/browser/mentor-demo.spec.ts'
      - 'playwright.mentor.config.ts'
      - '.github/workflows/mentor-browser.yml'
permissions:
  contents: read
concurrency:
  group: mentor-browser-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  mentor-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.0'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx next build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - run: npx playwright test --config=playwright.mentor.config.ts
      - name: Upload synthetic screenshots and test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mentor-browser-${{ github.event.pull_request.head.sha }}
          path: mentor-browser-artifacts/
          if-no-files-found: ignore
          retention-days: 14
