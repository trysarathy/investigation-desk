name: Clearline marketing checks
on:
  push:
    branches: [site/clearline-marketing-v1]
    paths: ['marketing/**', '.github/workflows/marketing-checks.yml']
  pull_request:
    paths: ['marketing/**', '.github/workflows/marketing-checks.yml']
permissions:
  contents: read
jobs:
  marketing:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: marketing
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Unit and copy checks
        run: npm run test
      - name: TypeScript
        run: npm run typecheck
      - name: Static build
        run: npm run build
