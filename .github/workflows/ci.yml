name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Required check (branch protection): type-check, tests, production build.
  ci:
    name: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.22.0" # matches Dockerfile node:22-slim
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npx next build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      # rc8: a build without CLEARLINE_TEST_BUILD=1 must not contain the recorded-chain path
      - run: node scripts/build/check-chain-recording.mjs --expect absent

  # rc5 Clearline Control: integration tests against a real PostgreSQL 16 (service container; no paid
  # infrastructure). They never skip: without the database URLs the suite fails with "BLOCKED".
  control-db:
    name: control-db
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-superuser-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ci-only-superuser-password
      CLEARLINE_TEST_OWNER_URL: postgres://clearline_owner:ci-owner-pw@127.0.0.1:5432/clearline_test
      CLEARLINE_TEST_RUNTIME_URL: postgres://clearline_runtime:ci-runtime-pw@127.0.0.1:5432/clearline_test
      CLEARLINE_TEST_JOBS_URL: postgres://clearline_jobs:ci-jobs-pw@127.0.0.1:5432/clearline_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.22.0"
          cache: npm
      - run: npm ci
      - run: scripts/db/setup-local.sh clearline_test ci-owner-pw ci-runtime-pw ci-jobs-pw
      - run: npm run test:control

  # Not required yet: main has 5 existing lint errors in app code
  # (react/no-unescaped-entities x4, @next/next/no-html-link-for-pages x1).
  # Make it required once engineering clears them.
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.22.0"
          cache: npm
      - run: npm ci
      - run: npm run lint
