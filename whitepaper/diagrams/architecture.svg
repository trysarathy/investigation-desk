  <g font-size="15" font-weight="600" fill="#0a0c11">
    <rect x="180" y="56" width="200" height="54" rx="7" fill="#fff" stroke="#6e7df0"/><text x="194" y="80">1 Instruction</text><text x="194" y="99" font-size="13" font-weight="400" fill="#5b6272">payment page, checker</text>
    <rect x="410" y="56" width="200" height="54" rx="7" fill="#fff" stroke="#6e7df0"/><text x="424" y="80">2 Verification</text><text x="424" y="99" font-size="13" font-weight="400" fill="#5b6272">rules and evidence</text>
    <rect x="180" y="140" width="200" height="54" rx="7" fill="#fff" stroke="#6e7df0"/><text x="194" y="164">3 Matching</text><text x="194" y="183" font-size="13" font-weight="400" fill="#5b6272">to one invoice</text>
    <rect x="410" y="140" width="200" height="54" rx="7" fill="#fff" stroke="#6e7df0"/><text x="424" y="164">4 Explanation</text><text x="424" y="183" font-size="13" font-weight="400" fill="#5b6272">cause, next step, reply</text>
    <rect x="410" y="232" width="200" height="54" rx="7" fill="#fff" stroke="#6e7df0"/><text x="424" y="256">5 Accounting</text><text x="424" y="275" font-size="13" font-weight="400" fill="#5b6272">plan, approve, post</text>
    <rect x="180" y="232" width="200" height="54" rx="7" fill="#fff" stroke="#6e7df0"/><text x="194" y="256">Person decides</text><text x="194" y="275" font-size="13" font-weight="400" fill="#5b6272">with a written reason</text>
    <rect x="180" y="320" width="430" height="80" rx="7" fill="#fff" stroke="#a3abba" stroke-dasharray="4 3"/>
    <text x="194" y="345">Records</text>
    <text x="194" y="366" font-size="13" font-weight="400" fill="#5b6272">requests, transfers, checks, decisions, posting audit</text>
    <text x="194" y="385" font-size="13" font-weight="400" fill="#5b6272">JSON files today; database and sign-in planned</text>
  </g>
