<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430" font-family="Inter, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6272"/></marker></defs>
  <rect width="800" height="430" fill="#ffffff"/>
  <g font-size="15" font-weight="600" text-anchor="middle" fill="#0a0c11">
