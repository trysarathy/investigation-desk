<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family="Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">How one stablecoin payment flows through Clearline</title><desc id="d">A customer pays on-chain. Clearline reads the transfer read-only and never holds funds, checks it is genuine (token contract, network, address, confirmations) and matches it to the invoice. If something is wrong, it explains it in plain English and drafts a reply. Either way, nothing is posted until a person approves; then the payment is posted to the invoice in Xero. QuickBooks is next and not built; NetSuite is designed, not built.</desc>
<defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8ea2ff"/></marker><marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ff8a7f"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a3aab6"/></marker></defs>
<rect width="900" height="470" fill="#0b0e14"/>
<rect x="228" y="16" width="656" height="320" rx="12" fill="#151a24" stroke="#8ea2ff" stroke-width="1.4"/>
<text x="246" y="40" font-size="12" font-weight="700" fill="#8ea2ff" letter-spacing="1">CLEARLINE · READ-ONLY, NEVER HOLDS FUNDS</text>
<rect x="16" y="60" width="190" height="92" rx="8" fill="#151a24" stroke="#2a3140" stroke-width="1.2"/>
<text x="30" y="86" font-size="15" font-weight="600" fill="#f2f4f7">1 Customer pays</text>
<text x="30" y="107" font-size="13" fill="#a3aab6">USDC or USDT,</text>
<text x="30" y="125" font-size="13" fill="#a3aab6">on-chain</text>
<rect x="246" y="60" width="190" height="92" rx="8" fill="#151a24" stroke="#8ea2ff" stroke-width="1.2"/>
<text x="260" y="86" font-size="15" font-weight="600" fill="#f2f4f7">2 Reads the transfer</text>
<text x="260" y="107" font-size="13" fill="#a3aab6">from the public chain;</text>
<text x="260" y="125" font-size="13" fill="#a3aab6">no wallet keys</text>
<rect x="470" y="60" width="190" height="110" rx="8" fill="#151a24" stroke="#8ea2ff" stroke-width="1.2"/>
<text x="484" y="86" font-size="15" font-weight="600" fill="#f2f4f7">3 Checks it's genuine</text>
<text x="484" y="107" font-size="13" fill="#a3aab6">token contract</text>
<text x="484" y="125" font-size="13" fill="#a3aab6">network · address</text>
<text x="484" y="143" font-size="13" fill="#a3aab6">confirmations</text>
<rect x="694" y="60" width="174" height="92" rx="8" fill="#151a24" stroke="#8ea2ff" stroke-width="1.2"/>
<text x="708" y="86" font-size="15" font-weight="600" fill="#f2f4f7">4 Matches</text>
<text x="708" y="107" font-size="13" fill="#a3aab6">to its invoice:</text>
<text x="708" y="125" font-size="13" fill="#a3aab6">amount, reference</text>
<rect x="470" y="226" width="232" height="92" rx="8" fill="#151a24" stroke="#ff8a7f" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="484" y="252" font-size="15" font-weight="600" fill="#f2f4f7">Explains what's wrong</text>
<text x="484" y="273" font-size="13" fill="#a3aab6">in plain English,</text>
<text x="484" y="291" font-size="13" fill="#a3aab6">and drafts a reply</text>
<rect x="246" y="370" width="232" height="84" rx="8" fill="#151a24" stroke="#f2f4f7" stroke-width="2"/>
<text x="260" y="396" font-size="15" font-weight="600" fill="#f2f4f7">5 A person approves</text>
<text x="260" y="417" font-size="13" fill="#a3aab6">nothing is posted before this</text>
<rect x="560" y="370" width="252" height="84" rx="8" fill="#151a24" stroke="#b9c6ff" stroke-width="1.6"/>
<text x="574" y="396" font-size="15" font-weight="600" fill="#b9c6ff">6 Posted to the invoice in Xero</text>
<text x="574" y="417" font-size="13" fill="#a3aab6">QuickBooks next (not built)</text>
<polyline points="206,106 244,106" fill="none" stroke="#8ea2ff" stroke-width="2" marker-end="url(#m)"/>
<polyline points="436,106 468,106" fill="none" stroke="#8ea2ff" stroke-width="2" marker-end="url(#m)"/>
<polyline points="660,106 692,106" fill="none" stroke="#8ea2ff" stroke-width="2" marker-end="url(#m)"/>
<polyline points="781,152 781,200 420,200 420,368" fill="none" stroke="#8ea2ff" stroke-width="2" marker-end="url(#m)"/>
<text x="440" y="192" font-size="13" font-weight="600" fill="#8ea2ff">all checks pass, invoice matched</text>
<polyline points="565,170 565,224" fill="none" stroke="#ff8a7f" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#w)"/>
<polyline points="840,152 840,272 704,272" fill="none" stroke="#ff8a7f" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#w)"/>
<text x="716" y="296" font-size="13" font-weight="600" fill="#ff8a7f">something is wrong</text>
<text x="716" y="313" font-size="13" font-weight="600" fill="#ff8a7f">(short, fake, wrong network…)</text>
<polyline points="530,318 530,345 450,345 450,368" fill="none" stroke="#ff8a7f" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#w)"/>
<polyline points="478,412 558,412" fill="none" stroke="#8ea2ff" stroke-width="2.5" marker-end="url(#m)"/>
<text x="486" y="404" font-size="12" font-weight="600" fill="#8ea2ff">approve</text>
<g font-size="12" fill="#a3aab6"><line x1="16" y1="190" x2="46" y2="190" stroke="#8ea2ff" stroke-width="2"/><text x="54" y="194">payment checks out</text><line x1="16" y1="214" x2="46" y2="214" stroke="#ff8a7f" stroke-width="2" stroke-dasharray="6 4"/><text x="54" y="218">problem: explained first</text><text x="16" y="250">NetSuite: designed,</text><text x="16" y="266">not built</text></g>
</svg>