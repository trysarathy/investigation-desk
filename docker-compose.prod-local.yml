# v1 phase 6: production mirrored on one machine (docs/ops/PROD_LOCAL.md). The same image as staging and production
# (Dockerfile.prod: a plain production build), the same three processes (web, worker, migrate job), PostgreSQL 16 with
# the four logins, and S3-compatible object storage for uploads. CLEARLINE_DEPLOY_ENV=local. Ports bind 127.0.0.1 only.
#
# Object storage: no MinIO image is available offline on the machine this was written on, so the "objects" service
# runs the repository's own signature-checking S3 stand-in (scripts/prodlocal/s3-standin.ts) from the app image, on a
# named volume. Swap in MinIO if you have the image: point CLEARLINE_S3_ENDPOINT at it and create the bucket.
#
#   1. cp .env.prod-local.example .env.prod-local and fill it (local-only values; the file is git-ignored)
#   2. docker compose -f docker-compose.prod-local.yml --env-file .env.prod-local up --build
#   3. scripts/deploy/smoke.sh http://127.0.0.1:4440
#
# NOT RUN on the authoring machine (no Docker daemon there); scripts/prodlocal/run.sh runs the same topology as local
# processes and is the one that was proved end to end. Fictional data only.
name: clearline-prod-local

x-app-env: &app-env
  NODE_ENV: production
  CLEARLINE_DEPLOY_ENV: local
  CLEARLINE_CONTROL_PILOT: "1"
  CLEARLINE_ORIGIN: http://127.0.0.1:4440
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set in .env.prod-local}
  DATABASE_URL: postgres://clearline_runtime:${RUNTIME_PW:?}@postgres:5432/clearline_prodlocal
  DATABASE_JOBS_URL: postgres://clearline_jobs:${JOBS_PW:?}@postgres:5432/clearline_prodlocal
  DATABASE_PROVISIONING_URL: postgres://clearline_provisioning:${PROV_PW:?}@postgres:5432/clearline_prodlocal
  CLEARLINE_UPLOAD_KEY: ${CLEARLINE_UPLOAD_KEY:?set in .env.prod-local}
  CLEARLINE_UPLOAD_STORE: s3
  # the stand-in accepts plain http on 127.0.0.1 only; inside compose it is reached through a port-forward (below)
  CLEARLINE_S3_ENDPOINT: http://127.0.0.1:4443
  CLEARLINE_S3_BUCKET: clearline-uploads-prodlocal
  CLEARLINE_S3_REGION: sgp1
  CLEARLINE_S3_ACCESS_KEY_ID: ${S3_KEY_ID:?}
  CLEARLINE_S3_SECRET_ACCESS_KEY: ${S3_SECRET:?}
  CLEARLINE_EMAIL_OUTBOX_DIR: /outbox

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${PG_SUPER_PW:?set in .env.prod-local}
    volumes: [pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 30

  # one-shot: the four logins and the database (scripts/db/setup-local.sh), then migrations as the owner
  migrate:
    build: { context: ., dockerfile: Dockerfile.prod }
    image: clearline:prod-local
    depends_on: { postgres: { condition: service_healthy } }
    user: root
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: ${PG_SUPER_PW:?}
      DATABASE_OWNER_URL: postgres://clearline_owner:${OWNER_PW:?}@postgres:5432/clearline_prodlocal
      OWNER_PW: ${OWNER_PW:?}
      RUNTIME_PW: ${RUNTIME_PW:?}
      JOBS_PW: ${JOBS_PW:?}
      PROV_PW: ${PROV_PW:?}
    entrypoint: ["sh", "-c", "apt-get -o Acquire::Retries=3 update -qq >/dev/null && apt-get install -y -qq postgresql-client >/dev/null && scripts/db/setup-local.sh clearline_prodlocal \"$$OWNER_PW\" \"$$RUNTIME_PW\" \"$$JOBS_PW\" \"$$PROV_PW\" && npx drizzle-kit migrate"]

  objects:
    image: clearline:prod-local
    depends_on: { migrate: { condition: service_completed_successfully } }
    environment:
      <<: *app-env
      CLEARLINE_S3_STANDIN_DIR: /objects
    command: ["npx", "tsx", "scripts/prodlocal/s3-standin.ts"]
    volumes: [objects:/objects]
    # web and worker share this service's network namespace (network_mode below), so the web port is published here
    ports: ["127.0.0.1:4440:4440"]

  web:
    image: clearline:prod-local
    depends_on: { migrate: { condition: service_completed_successfully }, objects: { condition: service_started } }
    environment: *app-env
    # the S3 stand-in listens on 127.0.0.1 of its own container; share its network namespace so 127.0.0.1:4443 reaches it
    network_mode: service:objects
    command: ["npx", "next", "start", "-H", "0.0.0.0", "-p", "4440"]
    volumes: [outbox:/outbox]

  worker:
    image: clearline:prod-local
    depends_on: { migrate: { condition: service_completed_successfully }, objects: { condition: service_started } }
    environment: *app-env
    network_mode: service:objects
    command: ["npx", "tsx", "--conditions=react-server", "scripts/jobs/worker.ts", "--interval-seconds", "60"]

volumes:
  pg: {}
  objects: {}
  outbox: {}
