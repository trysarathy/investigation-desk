# v1 phase 6: DigitalOcean App Platform spec, production. NOT CREATED: the founder creates it after deciding
# (docs/ops/HOSTING_PROPOSAL.md, "Provisioning"). Values marked CHANGE_ME are filled in a LOCAL, untracked copy
# (ops/do/*.local.yaml is git-ignored) from the password manager; App Platform encrypts SECRET values on create and
# they never return to this repository or to GitHub. CI changes only image.tag (scripts/deploy/do-deploy.sh).
# Singapore region; image from the DigitalOcean Container Registry (built once by CI, the same sha staging ran).
name: clearline-production
region: sgp
domains:
  - domain: app.clearlineconnect.org
    type: PRIMARY
    minimum_tls_version: "1.2"
# the managed PostgreSQL 16 cluster, attached so the app is a trusted source and ${db.CA_CERT} is bindable
databases:
  - name: db
    engine: PG
    production: true
    cluster_name: clearline-pg-production
envs:
  - { key: NODE_ENV, value: production, scope: RUN_TIME }
  - { key: CLEARLINE_DEPLOY_ENV, value: production, scope: RUN_TIME }
  - { key: CLEARLINE_CONTROL_PILOT, value: "1", scope: RUN_AND_BUILD_TIME }
  - { key: CLEARLINE_ORIGIN, value: "https://app.clearlineconnect.org", scope: RUN_TIME }
  - { key: NEXT_TELEMETRY_DISABLED, value: "1", scope: RUN_TIME }
  - { key: CLEARLINE_DB_CA_CERT, value: "${db.CA_CERT}", scope: RUN_TIME }
  # connection strings end in ?sslmode=verify-full&sslrootcert=/tmp/clearline-db-ca.pem (scripts/deploy/entrypoint.sh)
  - { key: DATABASE_URL, value: CHANGE_ME_runtime_login_url, type: SECRET, scope: RUN_TIME }
  - { key: DATABASE_JOBS_URL, value: CHANGE_ME_jobs_login_url, type: SECRET, scope: RUN_TIME }
  - { key: DATABASE_PROVISIONING_URL, value: CHANGE_ME_provisioning_login_url, type: SECRET, scope: RUN_TIME }
  - { key: BETTER_AUTH_SECRET, value: CHANGE_ME_64_random_hex, type: SECRET, scope: RUN_TIME }
  - { key: CLEARLINE_UPLOAD_KEY, value: CHANGE_ME_32_random_bytes_base64, type: SECRET, scope: RUN_TIME }
  - { key: CLEARLINE_UPLOAD_STORE, value: s3, scope: RUN_TIME }
  - { key: CLEARLINE_S3_ENDPOINT, value: "https://sgp1.digitaloceanspaces.com", scope: RUN_TIME }
  - { key: CLEARLINE_S3_REGION, value: sgp1, scope: RUN_TIME }
  - { key: CLEARLINE_S3_BUCKET, value: clearline-uploads-production, scope: RUN_TIME }
  - { key: CLEARLINE_S3_ACCESS_KEY_ID, value: CHANGE_ME_spaces_key_id_for_this_bucket_only, type: SECRET, scope: RUN_TIME }
  - { key: CLEARLINE_S3_SECRET_ACCESS_KEY, value: CHANGE_ME_spaces_secret, type: SECRET, scope: RUN_TIME }
  # e-mail: until the provider relay is built and approved, invitations go to the database outbox (nothing is sent)
  - { key: CLEARLINE_EMAIL_SENDER, value: outbox, scope: RUN_TIME }
  # chain reads stay OFF until the founder adds the keys (docs/ops/HOSTING_PROPOSAL.md, "Chain provider keys")
  - { key: CLEARLINE_CHAIN_LIVE, value: "0", scope: RUN_TIME }
services:
  - name: web
    image: { registry_type: DOCR, repository: clearline, tag: CHANGE_ME_set_by_ci }
    instance_size_slug: apps-s-1vcpu-1gb
    instance_count: 1
    http_port: 8080
    run_command: npx next start -H 0.0.0.0 -p 8080
    health_check: { http_path: /control/sign-in, initial_delay_seconds: 20, period_seconds: 30, timeout_seconds: 5, failure_threshold: 3 }
workers:
  - name: worker
    image: { registry_type: DOCR, repository: clearline, tag: CHANGE_ME_set_by_ci }
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    run_command: npx tsx --conditions=react-server scripts/jobs/worker.ts --interval-seconds 60
jobs:
  # expand-only migrations (scripts/deploy/check-migrations.mjs) before the new version takes traffic; on failure the
  # deployment stops and the old version keeps serving
  - name: migrate
    kind: PRE_DEPLOY
    image: { registry_type: DOCR, repository: clearline, tag: CHANGE_ME_set_by_ci }
    instance_size_slug: apps-s-1vcpu-0.5gb
    run_command: npx drizzle-kit migrate
    envs:
      - { key: DATABASE_OWNER_URL, value: CHANGE_ME_owner_login_url, type: SECRET, scope: RUN_TIME }
  # the retention purge, daily at 03:10 Singapore time (DEPLOYMENT_RUNBOOK_RC7: not run by the worker)
  - name: purge-uploads
    kind: SCHEDULED
    schedule: { cron: "10 3 * * *", time_zone: Asia/Singapore }
    image: { registry_type: DOCR, repository: clearline, tag: CHANGE_ME_set_by_ci }
    instance_size_slug: apps-s-1vcpu-0.5gb
    run_command: sh -c 'DATABASE_URL="$DATABASE_OWNER_URL" npx tsx --conditions=react-server scripts/control/admin.ts purge-uploads'
    envs:
      - { key: DATABASE_OWNER_URL, value: CHANGE_ME_owner_login_url, type: SECRET, scope: RUN_TIME }
alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
